name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ledgr

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1

      - name: Cache Build Runner
        uses: actions/cache@v4
        with:
          path: ledgr/.dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('ledgr/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -9 -r Runner.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Ledgr-iPA
          path: ledgr/Runner.ipa

      - name: Compress & send IPA to Telegram
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          zip -9 ledgr-ipa.zip Runner.ipa
          curl -s -S --max-time 120 \
            -F document=@"ledgr-ipa.zip" \
            -F chat_id="${CHAT_ID}" \
            -F message_thread_id="${TOPIC_ID}" \
            -F caption="Ledgr IPA — ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot${TOKEN}/sendDocument"
