name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ledgr

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          cache: true

      - name: Create local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - name: Cache Build Runner
        uses: actions/cache@v4
        with:
          path: ledgr/.dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('ledgr/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: dart format --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ledgr-apk
          path: ledgr/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Zip & send APK to Telegram
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        working-directory: ledgr
        run: |
          if [ -z "${TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Telegram secrets not configured; skipping Telegram delivery."
            exit 0
          fi
          cd build/app/outputs/flutter-apk
          zip -9 ledgr-apk.zip app-release.apk
          args=(
            -F document=@"ledgr-apk.zip" \
            -F chat_id="${CHAT_ID}" \
            -F caption="Ledgr APK — ${GITHUB_SHA:0:7}" \
          )
          if [ -n "${TOPIC_ID}" ]; then
            args+=( -F message_thread_id="${TOPIC_ID}" )
          fi
          curl -s -S --max-time 120 "${args[@]}" \
            "https://api.telegram.org/bot${TOKEN}/sendDocument"
