name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: budgetly

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1

      - name: Create local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: budgetly-apk
      #     path: budgetly/build/app/outputs/flutter-apk/app-release.apk

      - name: Zip & send APK to Telegram
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        working-directory: budgetly
        run: |
          cd build/app/outputs/flutter-apk
          zip -9 budgetly-apk.zip app-release.apk
          curl -s -S --max-time 120 \
            -F document=@"budgetly-apk.zip" \
            -F chat_id="${CHAT_ID}" \
            -F message_thread_id="${TOPIC_ID}" \
            -F caption="Budgetly APK — ${GITHUB_SHA:0:7}" \
            "https://api.telegram.org/bot${TOKEN}/sendDocument"
