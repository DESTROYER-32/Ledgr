name: budgetly
description: "Personal budget and financial tracking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Routing
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # Settings persistence
  shared_preferences: ^2.3.5
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Formatting
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # CSV
  csv: ^6.0.0

  # File picker
  file_picker: ^8.1.7

  # Share
  share_plus: ^10.1.4

  # HTTP
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  drift_dev: ^2.25.1
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

  # Testing
  sqlite3: ^2.7.5
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
